<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dhumble Hall of Fame</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <style>
        /* Compact Hall of Fame cards on mobile */
        @media (max-width: 576px) {

            #recordsContent .row.g-3 {
                --bs-gutter-x: 10px;
                --bs-gutter-y: 10px;
            }

            #recordsContent .row.g-3 > div > .border {
                padding: 10px 6px !important;
                min-height: 0;
            }

            #recordsContent .row.g-3 .fs-3 {
                font-size: 22px !important;
                line-height: 1.2;
                margin-bottom: 4px !important;
            }

            #recordsContent .row.g-3 .fs-5 {
                font-size: 15px !important;
                line-height: 1.3;
                margin-top: 6px !important;
            }

            #recordsContent .row.g-3 .small {
                font-size: 11px;
                line-height: 1.3;
            }

            #recordsContent .row.g-3 .mt-2 {
                margin-top: 6px !important;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-light bg-light mb-3">
        <div class="container">
            <span class="navbar-brand">Dhumblers</span>

            <a href="index.html" class="btn btn-sm btn-outline-primary">
                <i class="fas fa-arrow-left me-1"></i>
                Back to Home
            </a>
        </div>
    </nav>

    <div class="container">

        <!-- Hall of Fame -->
        <div class="card mb-4" id="recordsCard">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h5 class="mb-0">
                        🏛️ Dhumble Hall of Fame
                    </h5>

                    <span class="badge bg-warning text-dark">
                        All-Time Records
                    </span>
                </div>

                <div id="recordsContent">
                    <div class="text-center text-secondary py-4">
                        <div class="spinner-border spinner-border-sm me-2"
                             role="status"></div>
                        Loading records...
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Existing shared scripts -->
    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/player.js"></script>
    <script src="js/records.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await fetchUsers();
                await fetchGames();

                const predictionResponse = await fetch(
                    '/api/predictions/records/all-time'
                );

                if (!predictionResponse.ok) {
                    throw new Error('Failed to load prediction records');
                }

                const predictionData = await predictionResponse.json();

                window.allTimePredictionRecords =
                    predictionData.records || [];

                renderRecords();
            } catch (error) {
                console.error('Failed to load Hall of Fame:', error);

                document.getElementById('recordsContent').innerHTML = `
                    <div class="alert alert-danger">
                        Unable to load Hall of Fame records.
                        Please refresh the page.
                    </div>
                `;
            }
        });
    </script>

</body>
</html>
